<script>
const html=htm.bind(React.createElement);
const{useState,useEffect}=React;

// ── Config Export/Import for cross-machine transfer ──
function sfExportCfg(){
  const keys=['sf8_s','sf8_a','sf8_sl','sf8_c','sf8_ct','sf8_cfg'];
  const data={};
  keys.forEach(k=>{const v=localStorage.getItem(k);if(v)data[k]=v;});
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='StaffFlow_Config.json';a.click();
}
function sfImportCfg(msg){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=async e=>{
    try{
      const text=await e.target.files[0].text();
      const data=JSON.parse(text);
      Object.entries(data).forEach(([k,v])=>localStorage.setItem(k,v));
      if(msg)msg('✅ Config imported! Reloading…','inf');
      setTimeout(()=>location.reload(),1200);
    }catch(err){if(msg)msg('❌ Import failed: '+err.message,'err');}
  };
  inp.click();
}
// ── Full Data Backup / Restore ──
const ALL_KEYS=['sf8_s','sf8_a','sf8_sl','sf8_c','sf8_ct','sf8_cfg','sf8_att'];
function sfBackupAll(msg){
  const data={};
  ALL_KEYS.forEach(k=>{const v=localStorage.getItem(k);if(v)data[k]=v;});
  data._backupDate=new Date().toISOString();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  const dt=new Date().toISOString().slice(0,10);
  a.download='StaffFlow_Backup_'+dt+'.json';a.click();
  if(msg)msg('✅ Full backup downloaded!');
}
function sfRestoreAll(msg){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=async e=>{
    try{
      const text=await e.target.files[0].text();
      const data=JSON.parse(text);
      if(!confirm('⚠️ This will REPLACE all your current data. Are you sure?'))return;
      ALL_KEYS.forEach(k=>{if(data[k]!==undefined)localStorage.setItem(k,data[k]);});
      if(msg)msg('✅ Data restored! Reloading…','inf');
      setTimeout(()=>location.reload(),1200);
    }catch(err){if(msg)msg('❌ Restore failed: '+err.message,'err');}
  };
  inp.click();
}
async function sfPushToServer(msg){
  if(!_db)return msg('Firebase is not connected — please connect first','err');
  try{
    msg('⏳ Pushing to server…');
    for(const k of ALL_KEYS){
      const v=localStorage.getItem(k);
      if(v)await _db.ref('sf8/'+k).set(JSON.parse(v));
    }
    msg('✅ All data pushed to server!');
  }catch(e){msg('❌ Push failed: '+e.message,'err');}
}
async function sfPullFromServer(msg,localFbcfg){
  if(!_db)return msg('Firebase is not connected — please connect first','err');
  try{
    msg('⏳ Pulling data from server…');
    let any=false;
    for(const k of ALL_KEYS){
      const snap=await _db.ref('sf8/'+k).once('value');
      const v=snap.val();
      if(v!==null&&v!==undefined){
        any=true;
        // keep THIS device's own Firebase credentials so it's still connected after reload, even if server's copy differs
        if(k==='sf8_cfg'&&localFbcfg&&typeof v==='object')v.fbcfg=localFbcfg;
        localStorage.setItem(k,JSON.stringify(v));
      }
    }
    if(!any)return msg('No data found on the server yet — push from another device first','err');
    localStorage.setItem('sf8_fb_setup','done');
    msg('✅ Server data pulled to this device! Reloading…','inf');
    setTimeout(()=>location.reload(),1200);
  }catch(e){msg('❌ Pull failed: '+e.message,'err');}
}
const uid=()=>Math.random().toString(36).slice(2,10);
// Salary processing for a month usually happens in the first ~10 days of the next month, so up to the 10th
// the "current" month for default-selection / highlighting purposes is treated as the PREVIOUS calendar month.
const effTargetMY=d=>{let m=d.getMonth()+1,y=d.getFullYear();if(d.getDate()<=10){m-=1;if(m<1){m=12;y-=1;}}return{m,y};};
const today=()=>new Date().toISOString().slice(0,10);
// EPF Employee (12%) base — capped at the configured EPF Employee Wage Ceiling if one is set (0/blank = no cap, full Pay as per Record).
const epfEmpBase=(rate,st)=>{st=st||{};const ceil=Number(st.epfEmpWageCeil)||0;return ceil>0?Math.min(Number(rate)||0,ceil):(Number(rate)||0);};
const fR=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
// PDF-safe rupee formatter — jsPDF's built-in helvetica font has no ₹ glyph (it rendered as a broken "¶"),
// so every PDF (slip, reports, ledger, cheques) uses "Rs." instead of the ₹ symbol.
const fRp=n=>'Rs. '+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
// Total statutory deduction (EPF Employee+Employer, EPS, ESIC Employee+Employer) — based on Pay as per Record,
// but only counting the components this category actually uses (via its Margin or Cheque Amount chip selections).
const totalDeduction=(recPay,cfg,role)=>{
  cfg=cfg||{};
  const st=cfg.statutory||{};
  const rp=Number(recPay)||0;
  if(!rp)return 0;
  const epsWageCeil=st.epsWageCeil??15000;
  const esicWageLim=st.esicWageLim??21000;
  const capBase=Math.min(rp,epsWageCeil);
  const epfEmpAmt=Math.round(epfEmpBase(rp,st)*((st.epfEmp??12)/100));
  const epfPFAmt=Math.round(capBase*((st.epfErPF??3.67)/100));
  const epsAmt=Math.round(capBase*((st.epfErEPS??8.33)/100));
  const esicEmpAmt=rp<=esicWageLim?Math.round(rp*((st.esicEmp??0.75)/100)):0;
  const esicErAmt=rp<=esicWageLim?Math.round(rp*((st.esicEr??3.25)/100)):0;
  const active=dedActive(role,cfg);
  let total=0;
  if(active.epfEmp)total+=epfEmpAmt;
  if(active.epfPF)total+=epfPFAmt;
  if(active.eps)total+=epsAmt;
  if(active.esicEmp)total+=esicEmpAmt;
  if(active.esicEr)total+=esicErAmt;
  return total;
};
// Which statutory components are actually "in use" for a category — true only if that category's
// Margin or Cheque Amount chip selection has it set to add/subtract (not 'none'/unselected).
// Used to gate what's actually deducted when processing salary — a category with no chips selected
// should not have anything auto-deducted from Gross/Net, even though the raw statutory amounts are
// still computed (for reference/preview purposes elsewhere).
const dedActive=(role,cfg)=>{
  cfg=cfg||{};
  const selM={...DEF_CUSTOM_SEL,...((cfg.catMarginCustom||{})[role]||{})};
  const selC={...DEF_CHEQUE_SEL,...((cfg.catChequeCustom||{})[role]||{})};
  const isActive=k=>(selM[k]&&selM[k]!=='none')||(selC[k]&&selC[k]!=='none');
  return{epfEmp:isActive('epfEmp'),epfPF:isActive('epfPF'),eps:isActive('eps'),esicEmp:isActive('esicEmp'),esicEr:isActive('esicEr')};
};
// Cheque Amount = Pay as per Record minus EPF Employer (3.67%) minus EPS Employer (8.33%), both capped at the EPS wage ceiling, minus ESIC Employee (0.75%, if within the ESIC wage limit).
const roundAmt=(amt,st)=>{const n=Number(amt)||0;return (st&&st.roundOff10)?Math.round(n/5)*5:n;};
// Per-category margin rule: each component (EPF Employee/Employer, EPS Employer, ESIC Employee/Employer) is either 'add', 'subtract', or 'none' (default) to the base Cheque Amt − Actual Pay.
const DEF_CUSTOM_SEL={epfEmp:'add',epfPF:'add',eps:'add',esicEmp:'none',esicEr:'none'};
const marginAddOn=(role,comp,cfg)=>{
  comp=comp||{};
  const vals={epfEmp:Number(comp.epfEmp)||0,epfPF:Number(comp.epfPF)||0,eps:Number(comp.eps)||0,esicEmp:Number(comp.esicEmp)||0,esicEr:Number(comp.esicEr)||0};
  const sel={...DEF_CUSTOM_SEL,...(((cfg&&cfg.catMarginCustom)||{})[role]||{})};
  let total=0;
  for(const k in vals){
    if(sel[k]==='add')total+=vals[k];
    else if(sel[k]==='subtract')total-=vals[k];
  }
  return total;
};
// Per-category cheque rule: each component (EPF Employee/Employer, EPS Employer, ESIC Employee/Employer) is either
// 'add', 'subtract' (default for epfPF/eps/esicEmp, matching the original fixed formula), or 'none' (default for epfEmp/esicEr).
const DEF_CHEQUE_SEL={epfEmp:'none',epfPF:'subtract',eps:'subtract',esicEmp:'subtract',esicEr:'none'};
const CHIP_NAMES={epfEmp:'EPF Employee',epfPF:'EPF Employer',eps:'EPS Employer',esicEmp:'ESIC Employee',esicEr:'ESIC Employer'};
// Builds a human-readable "− X − Y + Z" fragment from a category's chip selection, for dynamic preview labels.
const selLabel=(role,cfg,defSel,customKey)=>{
  const sel={...defSel,...(((cfg&&cfg[customKey])||{})[role]||{})};
  const parts=[];
  for(const k of ['epfEmp','epfPF','eps','esicEmp','esicEr']){
    if(sel[k]==='add')parts.push('+ '+CHIP_NAMES[k]);
    else if(sel[k]==='subtract')parts.push('− '+CHIP_NAMES[k]);
  }
  return parts.length?parts.join(' '):'(no adjustments)';
};
const chequeAddOn=(role,comp,cfg)=>{
  comp=comp||{};
  const vals={epfEmp:Number(comp.epfEmp)||0,epfPF:Number(comp.epfPF)||0,eps:Number(comp.eps)||0,esicEmp:Number(comp.esicEmp)||0,esicEr:Number(comp.esicEr)||0};
  const sel={...DEF_CHEQUE_SEL,...(((cfg&&cfg.catChequeCustom)||{})[role]||{})};
  let total=0;
  for(const k in vals){
    if(sel[k]==='add')total+=vals[k];
    else if(sel[k]==='subtract')total-=vals[k];
  }
  return total;
};
// cfg here is the full app config object (needs .statutory and .catChequeCustom), role is the staff category
const chequeAmt=(recPay,cfg,role)=>{
  cfg=cfg||{};
  const st=cfg.statutory||{};
  const rp=Number(recPay)||0;
  const epsWageCeil=st.epsWageCeil??15000;
  const esicWageLim=st.esicWageLim??21000;
  const capBase=Math.min(rp,epsWageCeil);
  const epfEmpAmt=Math.round(epfEmpBase(rp,st)*((st.epfEmp??12)/100));
  const epfPFAmt=Math.round(capBase*((st.epfErPF??3.67)/100));
  const epsAmt=Math.round(capBase*((st.epfErEPS??8.33)/100));
  const esicEmpAmt=rp<=esicWageLim?Math.round(rp*((st.esicEmp??0.75)/100)):0;
  const esicErAmt=rp<=esicWageLim?Math.round(rp*((st.esicEr??3.25)/100)):0;
  const addOn=chequeAddOn(role,{epfEmp:epfEmpAmt,epfPF:epfPFAmt,eps:epsAmt,esicEmp:esicEmpAmt,esicEr:esicErAmt},cfg);
  let amt=Math.max(0,Math.round(rp+addOn));
  if(st.roundOff10)amt=Math.round(amt/5)*5;
  return amt;
};
const mName=(m,y)=>new Date(y,m-1,1).toLocaleString('en-IN',{month:'long',year:'numeric'});
const FD=30;
const getFY=d=>{const x=new Date(d||Date.now());return x.getMonth()>=3?x.getFullYear():x.getFullYear()-1;};
const fyLbl=fy=>`FY ${fy}-${String(fy+1).slice(2)}`;
const inFY=(mon,yr,fy)=>(yr===fy&&mon>=4)||(yr===fy+1&&mon<=3);
const K={staff:'sf8_s',adv:'sf8_a',sal:'sf8_sl',chq:'sf8_c',cats:'sf8_ct',cfg:'sf8_cfg'};
// Lightweight hash for the Settings PIN — avoids storing it as plain text in localStorage/backup
// exports. Not cryptographic-grade, but sufficient to stop a casual glance at raw saved data.
const simpleHash=str=>{let h=0;const s=String(str);for(let i=0;i<s.length;i++){h=(Math.imul(31,h)+s.charCodeAt(i))|0;}return (h>>>0).toString(36);};
let _db=null;
const initFB=async fbcfg=>{
  if(!fbcfg?.apiKey||!fbcfg?.databaseURL)return{ok:false,err:'Missing API Key or Database URL'};
  try{
    if(!window.firebase){
      await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
      await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
    }
    const ex=window.firebase.apps?.find(a=>a.name==='sf');
    if(ex)await ex.delete().catch(()=>{}); // always start from a clean app instance so a disconnect→reconnect never reuses stale state
    const app=window.firebase.initializeApp(fbcfg,'sf');
    _db=window.firebase.database(app);
    await _db.ref('.info/connected').once('value'); // confirm the database is actually reachable, not just that the SDK object was created
    return{ok:true};
  }catch(e){console.error(e);_db=null;return{ok:false,err:e.message||String(e)};}
};
const teardownFB=async()=>{try{const ex=window.firebase?.apps?.find(a=>a.name==='sf');if(ex)await ex.delete().catch(()=>{});}catch{}_db=null;};
const ld=async k=>{try{if(_db){const s=await _db.ref('sf8/'+k).once('value');if(s.val()!==null)return s.val();}const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}};
const sv=async(k,d)=>{try{localStorage.setItem(k,JSON.stringify(d));if(_db)_db.ref('sf8/'+k).set(d);}catch{}};
// ── Per-device page access (Firebase-controlled) ──
// Each browser/device gets a persistent random id. An admin, from any one connected device, can flip
// which pages (Dashboard/Salary/Advances/Cheques/Settings) are visible on any OTHER registered device —
// enforced live via the 'sf8/devices/{id}' Firebase node, since there's no way to gate a specific piece
// of hardware without a shared backend.
const PAGE_KEYS=[{k:'dash',t:0,l:'Dashboard'},{k:'sal',t:1,l:'Salary (+ Bulk)'},{k:'adv',t:2,l:'Advances'},{k:'chq',t:3,l:'Cheques'},{k:'set',t:4,l:'Settings'}];
const DEF_PERMS={dash:true,sal:true,adv:true,chq:true,set:true};
const getDeviceId=()=>{let id=localStorage.getItem('sf8_device_id');if(!id){id=uid()+uid();localStorage.setItem('sf8_device_id',id);}return id;};
// Employee IDs are alphanumeric (LIS0001, LT0001, LD0001…) built off an ever-increasing per-prefix
// counter (see nextEmpIdFor below) — never off staff.length or array position — so a deleted staff's
// ID is never reused.
const empIdStr=(n,prefix='LIS')=>prefix+String(n).padStart(3,'0');
const TH={
  dark:{bg:'#0D0F14',surf:'#13161D',card:'#181B24',bdr:'#1E2130',bdr2:'#2A2E42',txt:'#F1F2F6',sub:'#9DA3B4',mut:'#4B5270',acc:'#0071e3',accAlt:'#0064cc',accS:'rgba(0,113,227,.13)',accB:'rgba(0,113,227,.3)',grn:'#10B981',red:'#EF4444',blu:'#3B82F6',yel:'#F59E0B',pur:'#A855F7',inBg:'#1A1D26'},
  light:{bg:'#f2f2f7',surf:'rgba(255,255,255,0.85)',card:'#ffffff',bdr:'rgba(0,0,0,0.08)',bdr2:'rgba(0,0,0,0.05)',txt:'#1d1d1f',sub:'#6e6e73',mut:'#86868b',acc:'#0071e3',accAlt:'#0064cc',accS:'rgba(0,113,227,0.08)',accB:'rgba(0,113,227,0.3)',grn:'#34c759',red:'#ff3b30',blu:'#0071e3',yel:'#ff9f0a',pur:'#8B5CF6',inBg:'#ffffff'},
};
const CC=['#8B5CF6','#10B981','#3B82F6','#F59E0B','#EF4444','#06B6D4','#EC4899','#6366F1','#14B8A6','#F97316'];
const DEF_CATS=['Driver','Cleaner','Security','Gardner','Helper','Supervisor','Other'];
const Ico=({n,s=20,c='currentColor'})=>{
  const p={fill:'none',stroke:c,strokeWidth:'2',width:s,height:s,viewBox:'0 0 24 24'};
  const b={...p,strokeWidth:'2.5'};
  const d={
    grid:html`<svg ...${p}><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>`,

// ── Number to Indian words ──
function numToWords(n){
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  if(n===0)return'Zero';
  function words(num){
    if(num===0)return'';
    if(num<20)return a[num]+' ';
    if(num<100)return b[Math.floor(num/10)]+' '+(num%10?a[num%10]+' ':'');
    if(num<1000)return a[Math.floor(num/100)]+' Hundred '+(num%100?words(num%100):'');
    if(num<100000)return words(Math.floor(num/1000))+'Thousand '+(num%1000?words(num%1000):'');
    if(num<10000000)return words(Math.floor(num/100000))+'Lakh '+(num%100000?words(num%100000):'');
    return words(Math.floor(num/10000000))+'Crore '+(num%10000000?words(num%10000000):'');
  }
  const intPart=Math.floor(n), decPart=Math.round((n-intPart)*100);
  let w=words(intPart).trim();
  if(decPart>0)w+=' and Paise '+words(decPart).trim();
  return'Rupees '+w+' Only';

function genSalarySlipPDF(salRec, staffRec, cfg){
  const{jsPDF}=window.jspdf;
  const W=148, H=210;
  // Slip prints at a fixed 72x118mm size, top-centre on an A4 sheet (e.g. for gate-pass-card stock)
  const realDoc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const SLIP_W=72, SLIP_H=118, TOP_MARGIN=0;
  const SCALE=Math.min(SLIP_W/W, SLIP_H/H);
  const OFF_X=(realDoc.internal.pageSize.getWidth()-W*SCALE)/2, OFF_Y=TOP_MARGIN;
  const sx=v=>OFF_X+v*SCALE, sy=v=>OFF_Y+v*SCALE;
  const doc={
    setFont:(...a)=>realDoc.setFont(...a),
    setFontSize:sz=>realDoc.setFontSize(sz*SCALE),
    setTextColor:(...a)=>realDoc.setTextColor(...a),
    setDrawColor:(...a)=>realDoc.setDrawColor(...a),
    setFillColor:(...a)=>realDoc.setFillColor(...a),
    setLineWidth:w=>realDoc.setLineWidth(w*SCALE),
    splitTextToSize:(text,maxWidth)=>realDoc.splitTextToSize(text,maxWidth*SCALE),
    text:(text,x,y,opts)=>{
      const o=opts?{...opts}:undefined;
      if(o&&typeof o.maxWidth==='number')o.maxWidth*=SCALE;
      realDoc.text(text,sx(x),sy(y),o);
    },
    line:(x1,y1,x2,y2)=>realDoc.line(sx(x1),sy(y1),sx(x2),sy(y2)),
    rect:(x,y,w,h,style)=>realDoc.rect(sx(x),sy(y),w*SCALE,h*SCALE,style),
    roundedRect:(x,y,w,h,rx,ry,style)=>realDoc.roundedRect(sx(x),sy(y),w*SCALE,h*SCALE,rx*SCALE,ry*SCALE,style),
    circle:(x,y,r,style)=>realDoc.circle(sx(x),sy(y),r*SCALE,style),
    addImage:(data,ifmt,x,y,w,h)=>realDoc.addImage(data,ifmt,sx(x),sy(y),w*SCALE,h*SCALE),
  };
  const st=cfg.statutory||{};
  const agencyName='Lotus International School';
  const fmt=n=>fRp(n);
  const isBW=cfg&&cfg.reportColor===false;
  const toTitle=s=>{
    const parts=String(s||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
    if(parts.length===0) return '';
    const capFirst=w=>w.charAt(0).toUpperCase()+w.slice(1);
    if(parts.length===1) return capFirst(parts[0]);
    return parts.map((w,i)=>(i===0||i===parts.length-1)?capFirst(w):w).join(' ');
  };

  const cp=Number(salRec.cp)||0;
  const FDays=30;
  const abs=Number(salRec.abs)||0;
  const paidDays=FDays-abs;
  const paidRatio=paidDays/FDays;
  const pDayCP=cp/FDays;
  const absDedCP=Math.round(pDayCP*abs);
  const grossCP=Math.max(0,cp-absDedCP);
  const rate=Number(salRec.recPay)||0;
  const esicWL=st.esicWageLim??21000;
  const epfE=Math.round(Math.round(epfEmpBase(rate,st)*((st.epfEmp??12)/100))*paidRatio);
  const esicE=rate<=esicWL?Math.round(Math.round(rate*((st.esicEmp??0.75)/100))*paidRatio):0;
  const mDed=epfE+esicE; // employee-side only — matches what's actually itemised below (employer EPF/EPS/ESIC is the agency's cost, not deducted from staff)
  const netPay=Math.max(0,grossCP-mDed);

  if(isBW){
    // ══════════════════ B&W MODE — true minimalist black & white ══════════════════
    const INK=[28,28,30], GRY=[120,120,126], MUT=[160,160,166], LINE=[210,210,214], ACC=[0,0,0], RED=[0,0,0];
    const lm=16, rm=W-16, cw=W-32;
    let y=0;
    try{ if(typeof AGENCY_LOGO_PNG!=='undefined'&&AGENCY_LOGO_PNG) doc.addImage(AGENCY_LOGO_PNG,'PNG',lm,13,12,12); }catch(e){}
    doc.setFont('helvetica','bold');doc.setFontSize(12.5);doc.setTextColor(...INK);
    doc.text(agencyName.toUpperCase(),lm+15,19,{maxWidth:cw-56});
    doc.setFont('helvetica','normal');doc.setFontSize(6.1);doc.setTextColor(...MUT);
    doc.text((mName(salRec.mon,salRec.yr)+'  ·  Generated '+new Date().toLocaleDateString('en-IN')).toUpperCase(),lm+15,24);
    const pillW=25,pillH=6.2,pillX=rm-pillW,pillY=12.6;
    doc.setDrawColor(...INK);doc.setLineWidth(0.4);
    doc.roundedRect(pillX,pillY,pillW,pillH,3.1,3.1,'S');
    doc.setFont('helvetica','bold');doc.setFontSize(6.2);doc.setTextColor(...INK);
    doc.text('SALARY SLIP',pillX+pillW/2,pillY+4.2,{align:'center'});
    y=30;
    doc.setDrawColor(...INK);doc.setLineWidth(0.6);doc.line(lm,y,rm,y);
    doc.setDrawColor(...LINE);doc.setLineWidth(0.2);doc.line(lm,y+1.4,rm,y+1.4);
    y+=11;
    doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(...INK);
    doc.text(toTitle(salRec.name),lm,y,{maxWidth:cw-50});
    doc.setFont('helvetica','normal');doc.setFontSize(7.3);doc.setTextColor(...GRY);
    let subLine=(salRec.role||'')+(salRec.client?'  ·  '+salRec.client:'');
    if(staffRec&&staffRec.phone) subLine+='  ·  '+staffRec.phone;
    doc.text(subLine,lm,y+5.5,{maxWidth:cw-50});
    doc.text('Pay Period '+mName(salRec.mon,salRec.yr)+'   ·   Paid '+paidDays+'d, LOP '+abs+'d',lm,y+10.5);
    doc.setFont('helvetica','normal');doc.setFontSize(6.6);doc.setTextColor(...GRY);
    doc.text('NET PAY',rm,y-5,{align:'right'});
    doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(...ACC);
    doc.text(fmt(netPay),rm,y+2.5,{align:'right'});
    y+=19;
    doc.setDrawColor(...LINE);doc.setLineWidth(0.2);doc.line(lm,y,rm,y);
    y+=9;
    const gap=8, colW=(cw-gap)/2, leftX=lm, rightX=lm+colW+gap, topY=y;
    function colHead(x,lbl){
      doc.setFont('helvetica','bold');doc.setFontSize(7.3);doc.setTextColor(...INK);
      doc.text(lbl.toUpperCase(),x,y);
      doc.setFont('helvetica','normal');doc.setFontSize(6.2);doc.setTextColor(...MUT);
      doc.text('AMOUNT',x+colW,y,{align:'right'});
    }
    function drawRow(x,yy,lbl,val,bold,clr){
      const c=clr||(bold?INK:GRY), c2=clr||INK;
      doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(bold?8.3:7.3);doc.setTextColor(...c);
      const lines=doc.splitTextToSize(lbl,colW-24);
      doc.text(lines,x,yy);
      doc.setTextColor(...c2);doc.text(val,x+colW,yy,{align:'right'});
      return yy+Math.max(7,lines.length*4.3+2.4);
    }
    function subTotalLine(x,yy){ doc.setDrawColor(...LINE);doc.setLineWidth(0.2);doc.line(x,yy-3,x+colW,yy-3); }

    colHead(leftX,'Earnings');
    let yE=y+8.5;
    yE=drawRow(leftX,yE,'Monthly Salary',fmt(cp));
    if(abs>0) yE=drawRow(leftX,yE,'Loss of Pay ('+abs+'d)','- '+fmt(absDedCP));
    subTotalLine(leftX,yE);yE+=1.5;
    yE=drawRow(leftX,yE,'Gross Earnings',fmt(grossCP),true);

    colHead(rightX,'Deductions');
    let yD=y+8.5;
    if(mDed===0){ yD=drawRow(rightX,yD,'No Deductions','Nil'); }
    else{
      if(epfE>0) yD=drawRow(rightX,yD,'EPF Employee ('+(st.epfEmp??12)+'%)','- '+fmt(epfE));
      if(esicE>0) yD=drawRow(rightX,yD,'ESIC Employee ('+(st.esicEmp??0.75)+'%)','- '+fmt(esicE));
    }
    yD+=1.5;subTotalLine(rightX,yD);yD+=1.5;
    yD=drawRow(rightX,yD,'Total Deduction',mDed>0?'- '+fmt(mDed):fmt(0),true);

    y=Math.max(yE,yD)+7;
    doc.setDrawColor(...LINE);doc.setLineWidth(0.15);
    doc.line(leftX+colW+gap/2,topY-3,leftX+colW+gap/2,y-11);

    doc.setDrawColor(...INK);doc.setLineWidth(0.5);doc.line(lm,y,rm,y);
    y+=7;
    doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(...INK);
    doc.text('NET PAY',lm,y);
    doc.setFont('helvetica','normal');doc.setFontSize(6.3);doc.setTextColor(...GRY);
    doc.text('Gross Earnings − Deductions',lm,y+4.6);
    doc.setFont('helvetica','bold');doc.setFontSize(13.5);doc.setTextColor(...ACC);
    doc.text(fmt(netPay),rm,y+2,{align:'right'});
    y+=13;
    doc.setDrawColor(...LINE);doc.setLineWidth(0.2);doc.line(lm,y,rm,y);
    y+=9;

    const wStr=numToWords(Math.round(netPay));
    doc.setFont('helvetica','italic');doc.setFontSize(7.2);doc.setTextColor(...GRY);
    const wLines=doc.splitTextToSize('Rupees in words: '+wStr,cw);
    doc.text(wLines,lm,y);

// Title-case a name: only the first letter of the first and last word capitalized, rest lowercase (middle words left lowercase)
function titleCaseName(s){
  const parts=String(s||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(parts.length===0)return'';
  const capFirst=w=>w.charAt(0).toUpperCase()+w.slice(1);
  if(parts.length===1)return capFirst(parts[0]);
  return parts.map((w,i)=>(i===0||i===parts.length-1)?capFirst(w):w).join(' ');
}
async function downloadMonthExcel(monSal, staff, cfg, msgFn){
  try{
    if(!monSal||!monSal.length)return msgFn('No data this month','err');
    // NOTE: the free/community build of SheetJS (XLSX.writeFile) silently drops cell styling
    // (font size, bold, etc.) on save — only its paid Pro build honors `.s`. ExcelJS is used
    // here instead because it actually writes cell-level styles into the .xlsx file.
    if(typeof ExcelJS==='undefined')return msgFn('ExcelJS library not loaded','err');
    const st=cfg.statutory||{};
    const mon=monSal[0].mon, yr=monSal[0].yr;
    const esicWL=st.esicWageLim??21000;
    const headers=['Staff Name','Client Payment','Paid Days','Absent Days','Total Deduction','EPF Employer (3.67%)','EPS Employer (8.33%)','EPF Employee','ESIC Employer (3.25%)','ESIC Employee','Other Deduction','Net Pay'];
    const rows=monSal.map(s=>{
      const stf=staff.find(x=>x.id===s.sid)||{};
      const FD=30, abs=Number(s.abs)||0, paidDays=FD-abs, paidRatio=paidDays/FD;
      const rate=Number(s.recPay)||0;
      const epfEmp=Math.round(Math.round(epfEmpBase(rate,st)*((st.epfEmp??12)/100))*paidRatio);
      const epfPF=Math.round(Math.round(Math.min(rate,st.epsWageCeil??15000)*((st.epfErPF??3.67)/100))*paidRatio);
      const epsAmt=Math.round(Math.round(Math.min(rate,st.epsWageCeil??15000)*((st.epfErEPS??8.33)/100))*paidRatio);
      const esicEmp=rate<=esicWL?Math.round(Math.round(rate*((st.esicEmp??0.75)/100))*paidRatio):0;
      const esicEr=rate<=esicWL?Math.round(Math.round(rate*((st.esicEr??3.25)/100))*paidRatio):0;
      const totalStat=epfEmp+esicEmp+epfPF+epsAmt+esicEr;
      const mDedTotal=Number(s.mDed||s.mDedAmt)||0;
      const otherDed=Math.max(0,mDedTotal-totalStat);
      const grossEarnings=Math.max(0,(Number(s.cp)||0)-Math.round((Number(s.cp)||0)/FD*abs));
      const netPay=Number(s.net)||Math.max(0,grossEarnings-mDedTotal);
      const r2=n=>Number((Number(n)||0).toFixed(2));
      return[
        titleCaseName(s.name),
        r2(Number(s.cp)||0),
        paidDays,
        abs,
        r2(mDedTotal),
        r2(epfPF),
        r2(epsAmt),
        r2(epfEmp),
        r2(esicEr),
        r2(esicEmp),
        r2(otherDed),
        r2(netPay),
      ];
    });
    const wb=new ExcelJS.Workbook();
    const ws=wb.addWorksheet(mName(mon,yr).replace(' ','_'));
    ws.columns=[22,15,10,12,15,18,18,13,18,13,15,12].map(wch=>({width:wch}));
    const headerRow=ws.addRow(headers);
    headerRow.eachCell(c=>{c.font={size:10,bold:true};});
    const inrFmt='"₹"#,##,##0.00';
    const currencyCols=[2,5,6,7,8,9,10,11,12]; // 1-indexed: Client Payment, Total/EPF/EPS/ESIC/Other Deduction, Net Pay
    rows.forEach(r=>{
      const row=ws.addRow(r);
      row.eachCell((c,colNum)=>{
        c.font={size:10,bold:false};
        if(currencyCols.includes(colNum))c.numFmt=inrFmt;
      });
    });
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/octet-stream'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='Salary_'+mName(mon,yr).replace(' ','_')+'.xlsx';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
    msgFn('Excel downloaded!');
  }catch(e){console.error(e);msgFn('Excel error: '+e.message,'err');}
}

// ── Bulk ZIP download of all salary slips for a month ──
async function downloadBulkSlipsZip(monSal,staff,cfg,msgFn){
  try{
    if(!monSal||!monSal.length)return msgFn('No processed staff this month','err');
    if(!window.jspdf){msgFn('jsPDF not loaded','err');return;}
    if(typeof JSZip==='undefined'){msgFn('JSZip not loaded','err');return;}
    msgFn('Generating '+monSal.length+' slips…');
    await new Promise(r=>setTimeout(r,50)); // let UI update
    const zip=new JSZip();
    const mon=monSal[0].mon, yr=monSal[0].yr;
    const folder=zip.folder(mName(mon,yr)+'_Slips');
    for(const salRec of monSal){
      const staffRec=staff.find(s=>s.id===salRec.sid)||{};
      try{
        const doc=genSalarySlipPDF(salRec,staffRec,cfg);
        const pdfBytes=doc.output('arraybuffer');
        const fname=salRec.name.replace(/[^a-zA-Z0-9]/g,'_')+'_'+salRec.mon+'_'+salRec.yr+'.pdf';
        folder.file(fname,pdfBytes);
      }catch(err){console.warn('Slip failed for',salRec.name,err);}
    }
    const blob=await zip.generateAsync({type:'blob'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=mName(mon,yr)+'_Salary_Slips.zip';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},2000);
    msgFn('✅ '+monSal.length+' slips downloaded!');
  }catch(e){
    console.error('ZIP error:',e);
    msgFn('ZIP error: '+e.message,'err');
  }
}

function App(){
  const[tab,setTab]=useState(0);
  const[staff,setStaff]=useState([]);const[adv,setAdv]=useState([]);const[sal,setSal]=useState([]);const[chq,setChq]=useState([]);
  const[cats,setCats]=useState(DEF_CATS);const[cfg,setCfg]=useState({theme:'light',fys:[]});
  const[toast,setToast]=useState(null);const[ready,setReady]=useState(false);const[fbSt,setFbSt]=useState('disconnected');
  const[setUnlocked,setSetUnlocked]=useState(false);const[pinInput,setPinInput]=useState('');const[pinErr,setPinErr]=useState(false);
  const[myDeviceId]=useState(getDeviceId);
  const[myPerms,setMyPerms]=useState(null); // null = not yet loaded / no Firebase → treat as all-enabled
  const[myCatPerms,setMyCatPerms]=useState(null); // per-device category visibility, null = all-enabled
  const[allDevices,setAllDevices]=useState({});
  useEffect(()=>{(async()=>{
    // Every staff member is at the same client — this was previously an editable per-staff field, now fixed.
    // Silently normalizes old data (from local storage or Firebase, on any device) without needing an edit.
    const fixClients=arr=>{
      if(!arr||!arr.some(x=>x.client!=='Lotus International School'))return null;
      return arr.map(x=>({...x,client:'Lotus International School'}));
    };
    const[s,a,sl,c,ct,cf]=await Promise.all([ld(K.staff),ld(K.adv),ld(K.sal),ld(K.chq),ld(K.cats),ld(K.cfg)]);
    let staffArr=s||null,staffChanged=false;
    if(staffArr){const fx=fixClients(staffArr);if(fx){staffArr=fx;staffChanged=true;}}
    if(a)setAdv(a);if(sl)setSal(sl);if(c)setChq(c);if(ct)setCats(ct);
    const mc={theme:'light',fys:[],...(cf||{})};
    // ── Backfill category Codes for any categories created before this feature existed ──
    const catList=ct||cats;
    let catCodeChanged=false;
    if(catList&&catList.some(c=>!catCode(mc,c))){
      const nm={...(mc.catCodes||{})};
      catList.forEach(c=>{if(!nm[c]){nm[c]=autoCatCode(c,nm);catCodeChanged=true;}});
      mc.catCodes=nm;
    }
    // ── Backfill Employee IDs for any staff created before this feature existed ──
    // Uses each staff member's category Code as the ID prefix (falls back to LIS), with a running
    // counter per prefix so re-running this never reuses or skips a number.
    let empChanged=false;
    if(staffArr&&staffArr.some(x=>!x.empId)){
      staffArr=staffArr.map(x=>{
        if(x.empId)return x;
        empChanged=true;
        const{prefix,next,counters,empId}=nextEmpIdFor(mc,x.role);
        mc.empIdCounters=counters;
        return{...x,empId};
      });
      staffChanged=true;
    }
    if(staffArr)setStaff(staffArr);
    if(staffArr&&staffChanged)sv(K.staff,staffArr);
    // ── Auto-detect FYs from existing salary records ──
    let fyChanged=false;
    if(sl&&sl.length){
      const detectedFYs=new Set(mc.fys||[]);
      sl.forEach(r=>{const fy=inFY(r.mon,r.yr,r.yr-1)?r.yr-1:r.yr;detectedFYs.add(getFY(new Date(r.yr,r.mon-1,1)));});
      const sorted=[...detectedFYs].sort();
      if(sorted.join()!==(mc.fys||[]).join()){
        mc.fys=sorted;fyChanged=true;
        // set most recent as active if none set
        if(!mc.activeFY)mc.activeFY=sorted[sorted.length-1];
      }
    }
    if(empChanged||fyChanged||catCodeChanged)sv(K.cfg,mc);
    setCfg(mc);
    if(mc.fbcfg?.apiKey){setFbSt('connecting');const r=await initFB(mc.fbcfg);
      if(r.ok){setFbSt('connected');
        const _sets={staff:v=>{const fx=fixClients(v);if(fx){setStaff(fx);sv(K.staff,fx);}else setStaff(v);},adv:setAdv,sal:setSal,chq:setChq,cats:setCats,cfg:v=>setCfg({theme:'light',fys:[],...v})};
        const _def={staff:[],adv:[],sal:[],chq:[],cats:DEF_CATS,cfg:{theme:'light',fys:[]}};
        ['staff','adv','sal','chq','cats','cfg'].forEach(k=>{_db.ref('sf8/'+K[k]).on('value',sn=>{const v=sn.val()!==null?sn.val():_def[k];_sets[k](v);localStorage.setItem(K[k],JSON.stringify(v));});});
        // ── Register this device & subscribe to its own permissions + the full device list ──
        _db.ref('sf8/devices/'+myDeviceId).once('value').then(snap=>{
          if(snap.val()===null){_db.ref('sf8/devices/'+myDeviceId).set({name:'Device '+myDeviceId.slice(-4).toUpperCase(),pages:DEF_PERMS,lastSeen:Date.now()});}
          else{_db.ref('sf8/devices/'+myDeviceId+'/lastSeen').set(Date.now());}
        });
        _db.ref('sf8/devices/'+myDeviceId+'/pages').on('value',sn=>{setMyPerms(sn.val()||DEF_PERMS);});
        _db.ref('sf8/devices/'+myDeviceId+'/cats').on('value',sn=>{setMyCatPerms(sn.val()||null);});
        _db.ref('sf8/devices').on('value',sn=>{setAllDevices(sn.val()||{});});
      }
      else setFbSt('error');}
    setReady(true);
  })();},[]);
  const msg=(m,type='ok')=>{setToast({msg:m,type});setTimeout(()=>setToast(null),2600);};

async function genAdvancesPDF(adv,staff,cats,filterCat,msgFn,cfg){
  try{
    msgFn('Generating advances PDF…');
    applyReportColorMode(cfg);
    const{jsPDF}=window.jspdf,doc=new jsPDF('p','mm','a4');
    const ds=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
    const TS={fontSize:8,cellPadding:3,font:'helvetica'},TH2={fillColor:PRP,textColor:[255,255,255],fontStyle:'bold',fontSize:8},TA={fillColor:ALTROW},TF={fillColor:MID,textColor:BLK,fontStyle:'bold'};
    const label=filterCat&&filterCat!=='ALL'?filterCat+' — Advances':'All Advances Report';
    pdfPage(doc,'CASH ADVANCES',label,['Category: '+(filterCat==='ALL'?'All':filterCat),'Total Records: '+adv.length,'Generated: '+ds,'Date: '+ds],1,1);
    let y=35;
    const filtered=filterCat&&filterCat!=='ALL'?adv.filter(a=>{const s=staff.find(x=>x.id===a.staffId);return s&&s.role===filterCat;}):adv;
    const pending=filtered.filter(a=>a.status==='pending');
    const recovered=filtered.filter(a=>a.status==='deducted');
    const pAmt=pending.reduce((s,a)=>s+Number(a.amount),0);
    const rAmt=recovered.reduce((s,a)=>s+Number(a.amount),0);
    y=summBox(doc,[['Pending',fRp(pAmt),AMB],['Recovered',fRp(rAmt),GRN_],['Total Records',String(filtered.length),PRP]],y);
    if(pending.length){
      y=secHead(doc,'Pending Advances ('+pending.length+')',y);
      doc.autoTable({startY:y,head:[['Sr.','Staff Name','Role','Date','Note','Amount (₹)']],
        body:pending.map((a,i)=>{const s=staff.find(x=>x.id===a.staffId);return[i+1,s?.name||'—',s?.role||'—',a.date,a.note||'General Advance',fRp(a.amount)];}),
        styles:{...TS},headStyles:{...TH2},alternateRowStyles:{...TA},
        columnStyles:{0:{cellWidth:8,halign:'center'},5:{halign:'right'}},
        foot:[['','','','','TOTAL',fRp(pAmt)]],footStyles:{...TF}});
      y=doc.lastAutoTable.finalY+8;}
    if(recovered.length){
      if(y>230){doc.addPage();pdfPage(doc,'CASH ADVANCES',label,[],1,1);y=35;}
      y=secHead(doc,'Recovered Advances ('+recovered.length+')',y);
      doc.autoTable({startY:y,head:[['Sr.','Staff Name','Role','Date','Note','Amount (₹)','Deducted On']],
        body:recovered.map((a,i)=>{const s=staff.find(x=>x.id===a.staffId);return[i+1,s?.name||'—',s?.role||'—',a.date,a.note||'General Advance',fRp(a.amount),a.dedOn||'—'];}),
        styles:{...TS},headStyles:{...TH2},alternateRowStyles:{...TA},
        columnStyles:{0:{cellWidth:8,halign:'center'},5:{halign:'right'},6:{halign:'center',cellWidth:22}},
        foot:[['','','','','TOTAL',fRp(rAmt),'']],footStyles:{...TF}});}
    const pg=doc.internal.getNumberOfPages();for(let i=1;i<=pg;i++){doc.setPage(i);pdfPage(doc,'CASH ADVANCES',label,['Category: '+(filterCat==='ALL'?'All':filterCat),'Records: '+filtered.length,'Generated: '+ds,'Pending: '+fRp(pAmt)],i,pg);}
    doc.save('StaffFlow_Advances_'+(filterCat==='ALL'?'All':filterCat).replace(/\s+/g,'_')+'_'+new Date().toISOString().slice(0,10)+'.pdf');
    msgFn('Advances PDF downloaded ✓');}catch(e){console.error(e);msgFn('PDF failed','err');}
}

  const[apiKey,setApiKey]=useState(saved.apiKey||''),[dbURL,setDbURL]=useState(saved.databaseURL||''),[testing,setTesting]=useState(false);
  const[choice,setChoice]=useState(false),[busy,setBusy]=useState(false);
  const fbcfgNow=()=>({apiKey:apiKey.trim(),databaseURL:dbURL.trim(),projectId:dbURL.replace('https://','').split('.')[0]});
  const connect=async()=>{if(!apiKey.trim()||!dbURL.trim())return msg('Enter API Key and Database URL','err');setTesting(true);setFbSt('connecting');
    const r=await initFB(fbcfgNow());
    if(r.ok){
      const setupDone=localStorage.getItem('sf8_fb_setup')==='done';
      if(setupDone){
        // Already set up on this device before — just reconnect and resume live two-way sync, no prompt.
        const nc={...cfg,fbcfg:fbcfgNow()};setCfg(nc);setFbSt('connected');
        msg('Firebase reconnected — resuming live sync…','inf');
        setTimeout(()=>location.reload(),500);
      }else{
        // First time connecting on this device — don't touch any data yet, let the user pick a direction first.
        setFbSt('connected');setChoice(true);
        msg('First-time setup — choose a sync direction below ⬇️','inf');
      }
    }else{setFbSt('error');msg('Connection failed: '+(r.err||'check keys'),'err');}setTesting(false);};
  const doPush=async()=>{setBusy(true);const nc={...cfg,fbcfg:fbcfgNow()};setCfg(nc);await sfPushToServer(msg);localStorage.setItem('sf8_fb_setup','done');
    msg('Pushed — switching to live two-way sync…','inf');setTimeout(()=>location.reload(),700);};
  const doPull=async()=>{setBusy(true);await sfPullFromServer(msg,fbcfgNow());setBusy(false);};
  const disc=async()=>{await teardownFB();setFbSt('disconnected');setChoice(false);setBusy(false);localStorage.removeItem('sf8_fb_setup');const nc={...cfg,fbcfg:null};setCfg(nc);sv(K.cfg,nc);msg('Disconnected');};
  const sc={connected:T.grn,connecting:T.yel,error:T.red,disconnected:T.mut}[fbSt]||T.mut;
  const sl={connected:'Connected ✓',connecting:'Connecting…',error:'Error',disconnected:'Not Connected'}[fbSt]||'Unknown';
  return html`<div style=${{display:'flex',flexDirection:'column',gap:14}}>
    <div style=${{background:T.card,border:`1px solid ${T.bdr}`,borderRadius:14,padding:14}}><div style=${{display:'flex',justifyContent:'space-between',alignItems:'center'}}><div><div style=${{fontSize:13,fontWeight:800,color:T.txt}}>Firebase Realtime Sync</div><div style=${{fontSize:12,color:sc,marginTop:3,fontWeight:700}}>${sl}</div></div><div style=${{width:12,height:12,borderRadius:'50%',background:sc}}/></div></div>
    ${choice&&html`<${Mdl} title="Choose a sync direction" onClose=${()=>setChoice(false)} T=${T}>
      <div style=${{fontSize:12,color:T.sub,marginBottom:16,lineHeight:1.6}}><b style=${{color:T.txt}}>Push</b> — send this device's data to the server (the server's data will be overwritten).<br/><b style=${{color:T.txt}}>Pull</b> — bring the server's data to this device (this device's local data will be overwritten).</div>
      <div style=${{display:'flex',gap:8}}>
        <button onClick=${doPush} disabled=${busy} style=${{flex:1,background:T.blu,color:'#fff',border:'none',borderRadius:10,padding:'12px 0',fontSize:13,fontWeight:800,cursor:busy?'not-allowed':'pointer',opacity:busy?.6:1,fontFamily:'inherit'}}>⬆️ Push Local → Server</button>
        <button onClick=${doPull} disabled=${busy} style=${{flex:1,background:T.grn,color:'#fff',border:'none',borderRadius:10,padding:'12px 0',fontSize:13,fontWeight:800,cursor:busy?'not-allowed':'pointer',opacity:busy?.6:1,fontFamily:'inherit'}}>⬇️ Pull Server → Local</button>
      </div>
      <button onClick=${()=>setChoice(false)} style=${{width:'100%',marginTop:12,background:'transparent',border:'none',color:T.mut,fontSize:12,fontWeight:700,cursor:'pointer',fontFamily:'inherit',padding:'6px 0'}}>Decide later</button>
    <//>`}
    <div style=${{background:T.acc+'12',border:`1px solid ${T.accB}`,borderRadius:12,padding:13}}><div style=${{fontSize:11,fontWeight:800,color:T.acc,marginBottom:10}}>HOW TO SET UP (FREE)</div>${['Go to console.firebase.google.com','Create project → Realtime Database → Test mode','Project Settings → Add web app → Register','Copy apiKey and databaseURL below'].map((t,i)=>html`<div key=${i} style=${{display:'flex',gap:8,marginBottom:6}}><span style=${{color:T.acc,fontSize:12,fontWeight:800,flexShrink:0}}>${i+1}.</span><span style=${{color:T.sub,fontSize:12}}>${t}</span></div>`)}</div>
    <${Inp} T=${T} label="Firebase API Key *" value=${apiKey} onChange=${e=>setApiKey(e.target.value)} placeholder="AIzaSy…"/>
    <${Inp} T=${T} label="Database URL *" value=${dbURL} onChange=${e=>setDbURL(e.target.value)} placeholder="https://your-project.firebaseio.com"/>
    <div style=${{display:'flex',gap:10}}>${fbSt==='connected'?html`<${Btn} T=${T} v="danger" full ch="Disconnect" onClick=${disc}/>`:html`<${Btn} T=${T} full ch=${testing?'Connecting…':'Connect & Sync'} onClick=${connect} disabled=${testing}/>`}</div>
    <div style=${{marginTop:14,paddingTop:12,borderTop:`1.5px dashed ${T.bdr}`}}>
      <div style=${{fontSize:12,fontWeight:800,color:T.sub,marginBottom:6}}>📦 Config Transfer (For a New Machine)</div>
      <div style=${{fontSize:11,color:T.mut,marginBottom:8}}>Export Firebase credentials. Import on any machine — everything will auto-load.</div>
      <div style=${{display:'flex',gap:8}}>
        <button onClick=${()=>sfExportCfg()} style=${{flex:1,background:T.acc,color:'#fff',border:'none',borderRadius:8,padding:'8px 0',fontSize:12,fontWeight:800,cursor:'pointer'}}>⬇️ Export Config</button>
        <button onClick=${()=>sfImportCfg(msg)} style=${{flex:1,background:T.card,color:T.txt,border:`1.5px solid ${T.bdr}`,borderRadius:8,padding:'8px 0',fontSize:12,fontWeight:800,cursor:'pointer'}}>⬆️ Import Config</button>
      </div>
    </div>
    <div style=${{background:T.card,border:'1px solid '+T.bdr,borderRadius:14,padding:14}}>
      <div style=${{fontSize:11,fontWeight:800,color:T.sub,letterSpacing:.8,marginBottom:12}}>💾 FULL DATA BACKUP</div>
      <div style=${{fontSize:12,color:T.sub,marginBottom:10}}>Save/restore all data (staff, salary, advances, cheques) as a single JSON file.</div>
      <div style=${{display:'flex',gap:8}}>
        <button onClick=${()=>sfBackupAll(msg)} style=${{flex:1,background:T.grn,color:'#fff',border:'none',borderRadius:8,padding:'9px 0',fontSize:12,fontWeight:800,cursor:'pointer',fontFamily:'inherit'}}>💾 Backup All</button>
        <button onClick=${()=>sfRestoreAll(msg)} style=${{flex:1,background:T.card,color:T.txt,border:'1.5px solid '+T.grn+'55',borderRadius:8,padding:'9px 0',fontSize:12,fontWeight:800,cursor:'pointer',fontFamily:'inherit'}}>📂 Restore</button>
      </div>
    </div>
    <div style=${{marginTop:12,paddingTop:12,borderTop:`1.5px dashed ${T.bdr}`}}>
      <div style=${{fontSize:12,fontWeight:800,color:T.sub,marginBottom:4}}>☁️ Push Local → Server</div>
      <div style=${{fontSize:11,color:T.mut,marginBottom:8}}>Push this device's data to Firebase — the server's data will be replaced.</div>
      <button onClick=${()=>sfPushToServer(msg)} disabled=${fbSt!=='connected'} style=${{width:'100%',background:fbSt==='connected'?T.blu:T.bdr2,color:fbSt==='connected'?'#fff':T.mut,border:'none',borderRadius:8,padding:'9px 0',fontSize:12,fontWeight:800,cursor:fbSt==='connected'?'pointer':'not-allowed',opacity:fbSt==='connected'?1:.6}}>
        ${fbSt==='connected'?'🚀 Push to Firebase':'🔒 Connect to Firebase first'}
      </button>
    </div>
  </div>`;
}
document.addEventListener('wheel',e=>{const el=document.activeElement;if(el&&el.tagName==='INPUT'&&el.type==='number')el.blur();},{passive:true});
ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(App));
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.log('SW register failed:', err));
  });
}
</script>
</body>
</html>
